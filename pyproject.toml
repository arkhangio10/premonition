[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premonition-lab"
version = "0.1.0"
description = "A low-cost arm that maps its own reach, checks its cameras and learns to grasp from its failures, with Meta Muse and SAM."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
premonition = "premonition.cli:entry"

[tool.setuptools]
packages = ["premonition"]

[tool.setuptools.package-data]
premonition = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
